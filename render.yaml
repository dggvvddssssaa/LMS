databases:
  - name: lms-db
    databaseName: lms_db
    user: lms_user
    plan: free # or starter

services:
  # Redis Cache
  - type: redis
    name: lms-redis
    plan: free
    ipAllowList: [] # internal connections only

  # Backend Web Service
  - type: web
    name: lms-backend
    env: node
    plan: free # or starter
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma db push --accept-data-loss && npm run prisma:seed
    startCommand: npm start
    envVars:
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: lms-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: lms-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "https://lms-frontend-9v1p.onrender.com"
      - key: SEPAY_WEBHOOK_API_KEY
        generateValue: true
      # Note: Mediasoup settings will be ignored by Render's load balancer for UDP, 
      # but are kept here to prevent crashes during startup.
      - key: MEDIASOUP_LISTEN_IP
        value: 0.0.0.0
      - key: MEDIASOUP_ANNOUNCED_IP
        value: 127.0.0.1 # This ideally needs to be the public IP of the Render instance, which is dynamic/hidden.
      
  # Frontend Static Site
  - type: web
    name: lms-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: VITE_API_URL
        value: "https://lms-backend-6yql.onrender.com"
      - key: VITE_SOCKET_URL
        value: "https://lms-backend-6yql.onrender.com"

