version: '3.8'

services:
  # Database
  postgres:
    image: postgres:15-alpine
    container_name: lms_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-lms_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Cache & PubSub
  redis:
    image: redis:7-alpine
    container_name: lms_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # TURN/STUN Server (required for NAT traversal in production)
  coturn:
    image: coturn/coturn
    container_name: lms_coturn
    restart: always
    network_mode: host  # TURN needs direct access to host network for UDP relay
    environment:
      - TURNSERVER_REALM=${TURN_REALM:-lms.example.com}
    command:
      - -n
      - --log-file=stdout
      - --min-port=49152
      - --max-port=65535
      - --realm=${TURN_REALM:-lms.example.com}
      - --user=${TURN_USER:-lmsuser}:${TURN_PASSWORD:-lmspass}
      - --lt-cred-mech
      - --fingerprint

  # Backend API + Socket + Mediasoup
  backend:
    build: ./backend
    container_name: lms_backend
    restart: always
    network_mode: host  # Mediasoup UDP needs direct host networking
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=4000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-changeme}@localhost:5432/${POSTGRES_DB:-lms_db}
      - REDIS_URL=redis://localhost:6379
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - CORS_ORIGIN=${CORS_ORIGIN:-https://your-frontend-domain.com}
      # IMPORTANT: Set MEDIASOUP_ANNOUNCED_IP to your server's PUBLIC IP or domain
      - MEDIASOUP_MIN_PORT=40000
      - MEDIASOUP_MAX_PORT=40100
      - MEDIASOUP_LISTEN_IP=0.0.0.0
      - MEDIASOUP_ANNOUNCED_IP=${MEDIASOUP_ANNOUNCED_IP:?Set this to your public IP}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Frontend React (serve built files via nginx in production)
  frontend:
    build: ./frontend
    container_name: lms_frontend
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      - VITE_API_URL=${VITE_API_URL:-https://api.your-domain.com}
    depends_on:
      - backend

volumes:
  postgres_data:
